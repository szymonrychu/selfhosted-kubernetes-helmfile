tcp:
  "1883": "home-automation/mosquitto-eclipse-mosquitto:1883"

imagePullSecrets:
  - name: regcred

controller:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  dnsConfig:
    nameservers:
      - 192.168.1.1
  hostPort:
    enabled: true

  updateStrategy:
    type: Recreate

  config:
    Referrer-Policy: strict-origin-when-cross-origin
    X-Content-Type-Options: nosniff
    X-Frame-Options: SAMEORIGIN
    X-XSS-Protection: 1; mode=block
    allow-snippet-annotations: "true"
    annotations-risk-level: Critical
    hide-headers: X-Powered-By,Server
    http-snippet: |
      map $http_cf_ipcountry $geo_blocked {
        default 1;
        # EU countries
        AT 0;  # Austria
        BE 0;  # Belgium
        BG 0;  # Bulgaria
        HR 0;  # Croatia
        CY 0;  # Cyprus
        CZ 0;  # Czech Republic
        DK 0;  # Denmark
        EE 0;  # Estonia
        FI 0;  # Finland
        FR 0;  # France
        DE 0;  # Germany
        GR 0;  # Greece
        HU 0;  # Hungary
        IE 0;  # Ireland
        IT 0;  # Italy
        LV 0;  # Latvia
        LT 0;  # Lithuania
        LU 0;  # Luxembourg
        MT 0;  # Malta
        NL 0;  # Netherlands
        PL 0;  # Poland
        PT 0;  # Portugal
        RO 0;  # Romania
        SK 0;  # Slovakia
        SI 0;  # Slovenia
        ES 0;  # Spain
        SE 0;  # Sweden
        # USA
        US 0;
        # Allow requests without CF-IPCountry header (local/internal traffic)
        "" 0;
      }
    large-client-header-buffers: 8 128k
    proxy-buffer-size: 16k
    server-snippet: |
      if ($geo_blocked = 1) {
        return 403;
      }
    server-tokens: "false"

  priorityClassName: system-cluster-critical
  replicaCount: 3

  resources:
    requests:
      cpu: 300m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ingress-nginx
        topologyKey: "kubernetes.io/hostname"

  admissionWebhooks:
    enabled: false
    timeoutSeconds: 10

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: NGINXConfigFailed
          expr: count(nginx_ingress_controller_config_last_reload_successful == 0) > 0
          for: 1s
          labels:
            severity: critical
          annotations:
            description: bad ingress config - nginx config test failed
            summary: uninstall the latest ingress changes to allow config reloads to resume
        - alert: NGINXCertificateExpiry
          expr: (avg(nginx_ingress_controller_ssl_expire_time_seconds) by (host) - time()) < 604800
          for: 1s
          labels:
            severity: critical
          annotations:
            description: ssl certificate(s) will expire in less then a week
            summary: renew expiring certificates to avoid downtime
        - alert: NGINXTooMany500s
          expr: 100 * ( sum( nginx_ingress_controller_requests{status=~"5.+"} ) / sum(nginx_ingress_controller_requests) ) > 5
          for: 1m
          labels:
            severity: warning
          annotations:
            description: Too many 5XXs
            summary: More than 5% of all requests returned 5XX, this requires your attention
        - alert: NGINXTooMany400s
          expr: 100 * ( sum( nginx_ingress_controller_requests{status=~"4.+"} ) / sum(nginx_ingress_controller_requests) ) > 5
          for: 1m
          labels:
            severity: warning
          annotations:
            description: Too many 4XXs
          summary: More than 5% of all requests returned 4XX, this requires your attention
